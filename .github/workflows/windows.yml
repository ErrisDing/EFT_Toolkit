name: windows

on:
  push:
    branches: [main]
    # A version tag is what turns a green run into a release. The release job below runs only for
    # these, so an ordinary push to main still just builds and tests.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test-publish:
    name: Build, test, and publish (Windows 11 x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EftToolkit.sln

      # -warnaserror matches TreatWarningsAsErrors in Directory.Build.props: a warning that is not a
      # failure on a developer's machine is not a warning anyone reads.
      - name: Build
        run: dotnet build EftToolkit.sln --configuration Release --no-restore -warnaserror

      # The hardware category is the tests that need a real display or a real audio endpoint. They are
      # skipped rather than faked, and they are not part of the release gate; the manual checklist is
      # what covers what they would have covered.
      - name: Test
        run: dotnet test EftToolkit.sln --configuration Release --no-build --filter 'Category!=Hardware'

      - name: Publish
        run: pwsh -File scripts/publish.ps1

      - name: Reject ASIO dependencies and artifacts
        shell: pwsh
        run: |
          $dependencyMatches = dotnet list src/EftToolkit.Audio/EftToolkit.Audio.csproj package --include-transitive |
            Select-String -Pattern 'NAudio\.Asio'
          $fileMatches = Get-ChildItem artifacts/publish/win-x64 -Recurse | Where-Object Name -Match 'asio'

          if ($dependencyMatches) {
            Write-Host $dependencyMatches
            throw 'An ASIO dependency is present in the audio project.'
          }

          if ($fileMatches) {
            Write-Host $fileMatches
            throw 'An ASIO file is present in the published artifact.'
          }

      - name: Assert the audio backend is NAudio.Wasapi, and only that
        shell: pwsh
        run: |
          # Explicitly not the NAudio meta-package, which would drag in the parts of NAudio this
          # toolkit has decided not to carry, and not NAudio.Asio, which it must never carry.
          $packages = (dotnet list src/EftToolkit.Audio/EftToolkit.Audio.csproj package --include-transitive | Out-String)

          Write-Host $packages

          if ($packages -notmatch 'NAudio\.Wasapi\s+2\.4\.0') {
            throw 'NAudio.Wasapi 2.4.0 is not the audio backend.'
          }

          if ($packages -match '(?m)^\s*>?\s*NAudio\s+\d') {
            throw 'The NAudio meta-package is referenced.'
          }

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: eft-toolkit-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error

  # A release is cut from a tag rather than from a local build on purpose. Everything above - build,
  # tests, the ASIO dependency checks, and the publish itself - has to have passed on a real Windows
  # runner before anything is offered for download, which is the only way a claim about a Windows
  # artifact is worth making. The artifact is uploaded here and nowhere else.
  release:
    name: Release (tag only)
    needs: build-test-publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eft-toolkit-win-x64
          path: eft-toolkit-win-x64

      - name: Package
        shell: pwsh
        run: |
          # The release carries a zip as well as the raw executable: the exe is what someone runs,
          # and the zip is what carries the license and readme beside it without any chance of them
          # being separated. Both are 75 MB of compressed runtime, so the zip costs almost nothing.
          #
          # Named from the tag rather than from a literal. A hard-coded version here would go on
          # producing 0.1.0 archives at every later tag, and nothing would fail to say so.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Compress-Archive -Path eft-toolkit-win-x64/* -DestinationPath "eft-toolkit-$version-win-x64.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')

          gh release create ${{ github.ref_name }} `
            --title "EFT Toolkit ${{ github.ref_name }}" `
            --notes "Windows 11 x64. Unpack and run EftToolkit.App.exe - no installer and no administrator rights." `
            "eft-toolkit-$version-win-x64.zip" `
            eft-toolkit-win-x64/EftToolkit.App.exe
