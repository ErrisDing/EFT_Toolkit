name: windows

on:
  push:
    branches: [main]
    # A version tag is what turns a green run into a release. The release job below runs only for
    # these, so an ordinary push to main still just builds and tests.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test-publish:
    name: Build, test, and publish (Windows 11 x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EftToolkit.sln

      # -warnaserror matches TreatWarningsAsErrors in Directory.Build.props: a warning that is not a
      # failure on a developer's machine is not a warning anyone reads.
      - name: Build
        run: dotnet build EftToolkit.sln --configuration Release --no-restore -warnaserror

      # The hardware category is the tests that need a real display or a real audio endpoint. They are
      # skipped rather than faked, and they are not part of the release gate; the manual checklist is
      # what covers what they would have covered.
      #
      # The result file is written whatever the outcome and uploaded below, because a failing run that
      # says only "exit code 1" cannot be acted on: the failing test's name and message are the whole
      # of the diagnosis, and the raw log needs repository admin rights to read.
      - name: Test
        id: test
        continue-on-error: true
        run: dotnet test EftToolkit.sln --configuration Release --no-build --filter 'Category!=Hardware' --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn

      # The verdict also goes to a step output, and the step below puts it in its own name. That is
      # not decoration: subprocess output is readable only with repository admin rights, while a
      # step's name is readable by anyone through the API, so a failure the name carries can actually
      # be diagnosed by whoever is looking at the run.
      - name: Summarise the test results
        id: summary
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/test-results -Filter '*.trx' -ErrorAction SilentlyContinue

          if (-not $files) {
            $verdict = 'NO RESULT FILE WAS WRITTEN - the tests did not run to completion'
            $verdict | Add-Content $env:GITHUB_STEP_SUMMARY
            Write-Host $verdict
            "verdict=$verdict" | Add-Content $env:GITHUB_OUTPUT
            exit 0
          }

          $results = $files | ForEach-Object { [xml](Get-Content $_.FullName) }
          $lines = @()
          $failedNames = @()

          foreach ($result in $results) {
            $counters = $result.TestRun.ResultSummary.Counters
            $lines += "Passed $($counters.passed), failed $($counters.failed), skipped $($counters.notExecuted), total $($counters.total)."
            $lines += ''

            foreach ($test in $result.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
              $failedNames += $test.testName
              $lines += "FAILED  $($test.testName)"

              $message = $test.Output.ErrorInfo.Message
              $stack = $test.Output.ErrorInfo.StackTrace

              if ($message) { $lines += "        $message" }
              if ($stack) { $lines += "        $($stack -split "`n" | Select-Object -First 4)" }

              $lines += ''
            }
          }

          $lines | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host ($lines -join "`n")

          $verdict = if ($failedNames) { "TEST FAILURES: $($failedNames -join ', ')" } else { 'the tests passed' }
          "verdict=$verdict" | Add-Content $env:GITHUB_OUTPUT

      # Named from the verdict so the failing tests are the step's own name. Keep it to one line.
      - name: Result - ${{ steps.summary.outputs.verdict }}
        if: steps.test.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host 'The test step failed. The full messages are on the test-results artifact and in the job summary.'
          exit 1

      - name: Publish
        run: pwsh -File scripts/publish.ps1

      - name: Reject ASIO dependencies and artifacts
        shell: pwsh
        run: |
          $dependencyMatches = dotnet list src/EftToolkit.Audio/EftToolkit.Audio.csproj package --include-transitive |
            Select-String -Pattern 'NAudio\.Asio'
          $fileMatches = Get-ChildItem artifacts/publish/win-x64 -Recurse | Where-Object Name -Match 'asio'

          if ($dependencyMatches) {
            Write-Host $dependencyMatches
            throw 'An ASIO dependency is present in the audio project.'
          }

          if ($fileMatches) {
            Write-Host $fileMatches
            throw 'An ASIO file is present in the published artifact.'
          }

      - name: Assert the audio backend is NAudio.Wasapi, and only that
        shell: pwsh
        run: |
          # Explicitly not the NAudio meta-package, which would drag in the parts of NAudio this
          # toolkit has decided not to carry, and not NAudio.Asio, which it must never carry.
          $packages = (dotnet list src/EftToolkit.Audio/EftToolkit.Audio.csproj package --include-transitive | Out-String)

          Write-Host $packages

          if ($packages -notmatch 'NAudio\.Wasapi\s+2\.4\.0') {
            throw 'NAudio.Wasapi 2.4.0 is not the audio backend.'
          }

          if ($packages -match '(?m)^\s*>?\s*NAudio\s+\d') {
            throw 'The NAudio meta-package is referenced.'
          }

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: eft-toolkit-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error

  # A release is cut from a tag rather than from a local build on purpose. Everything above - build,
  # tests, the ASIO dependency checks, and the publish itself - has to have passed on a real Windows
  # runner before anything is offered for download, which is the only way a claim about a Windows
  # artifact is worth making. The artifact is uploaded here and nowhere else.
  release:
    name: Release (tag only)
    needs: build-test-publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eft-toolkit-win-x64
          path: eft-toolkit-win-x64

      - name: Package
        shell: pwsh
        run: |
          # The release carries a zip as well as the raw executable: the exe is what someone runs,
          # and the zip is what carries the license and readme beside it without any chance of them
          # being separated. Both are 75 MB of compressed runtime, so the zip costs almost nothing.
          #
          # Named from the tag rather than from a literal. A hard-coded version here would go on
          # producing 0.1.0 archives at every later tag, and nothing would fail to say so.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Compress-Archive -Path eft-toolkit-win-x64/* -DestinationPath "eft-toolkit-$version-win-x64.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')

          gh release create ${{ github.ref_name }} `
            --title "EFT Toolkit ${{ github.ref_name }}" `
            --notes "Windows 11 x64. Unpack and run EftToolkit.App.exe - no installer and no administrator rights." `
            "eft-toolkit-$version-win-x64.zip" `
            eft-toolkit-win-x64/EftToolkit.App.exe
